[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "FraudSignalLab"
version = "0.1.0"
description = "Point-in-time transaction features and imbalanced fraud classification on synthetic data"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<4", "scikit-learn>=1.5,<2", "imbalanced-learn>=0.14,<1", "lightgbm>=4.6,<5", "matplotlib>=3.9,<4", "joblib>=1.4,<2"]

[project.scripts]
fraud-signal = "fraud_signal.cli:main"

[tool.setuptools.packages.find]
include = ["fraud_signal*"]
